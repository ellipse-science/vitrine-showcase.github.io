  <!-- En-tête 3 zones : marque (gauche) · édition du moment (centre) · utilitaires (droite) -->
  <div class="site-header">

    <!-- Gauche : marque -->
    <header class="mast">
      <div class="brand">
        <a href="./" aria-label="La Vitrine démocratique">
          <img class="logo-vitrine" alt="La Vitrine démocratique"
               src="/images/brand/logo_vitrinedemocratique_bg-none_theme-black.png">
        </a>
        <div class="brand-footer">
          <a class="capp-attribution" href="https://capp-ulaval.ca/" target="_blank" rel="noopener" aria-label="CAPP, Université Laval">
            <span class="capp-prefix">Propulsé par le</span>
            <img class="logo-capp" alt="CAPP · Université Laval"
                 src="/images/brand/logo_capp_1row_bg-none_theme-black.png">
          </a>
        </div>
      </div>
    </header>

    <!-- Centre : édition du moment (cycle des mises à jour, l'édition courante en évidence) -->
    <div class="header-edition" aria-label="Édition du moment">
      <div class="pulse-icons">
        <!-- 00h : pleine lune — coeur de la nuit -->
        <div class="pulse-icon past" title="Mise à jour de 00 h">
          <svg class="celestial" viewBox="0 0 24 24" role="img" aria-label="Nuit">
            <circle cx="12" cy="12" r="7.4" fill="currentColor"/>
          </svg>
          <span class="pulse-hour">00 h</span>
        </div>

        <!-- 04h : lune — nuit/aube -->
        <div class="pulse-icon past" title="Mise à jour de 04 h">
          <svg class="celestial" viewBox="0 0 24 24" role="img" aria-label="Avant l'aube">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor"/>
          </svg>
          <span class="pulse-hour">04 h</span>
        </div>

        <!-- 08h : soleil levant — matin -->
        <div class="pulse-icon past" title="Mise à jour de 08 h">
          <svg class="celestial" viewBox="0 0 24 24" role="img" aria-label="Matin">
            <!-- Horizon line -->
            <line x1="3" y1="16" x2="21" y2="16" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <!-- Semi-circle rising sun -->
            <path d="M8 16a4 4 0 0 1 8 0" fill="currentColor"/>
            <!-- Upper rays -->
            <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
              <line x1="12" y1="8" x2="12" y2="5"/>
              <line x1="7.5" y1="11.5" x2="5.5" y2="9.5"/>
              <line x1="16.5" y1="11.5" x2="18.5" y2="9.5"/>
              <line x1="9.3" y1="9.3" x2="7.5" y2="7.5"/>
              <line x1="14.7" y1="9.3" x2="16.5" y2="7.5"/>
            </g>
          </svg>
          <span class="pulse-hour">08 h</span>
        </div>

        <!-- 12h : soleil plein — midi, actuelle -->
        <div class="pulse-icon current" title="Mise à jour actuelle · 12 h">
          <svg class="celestial" viewBox="0 0 24 24" role="img" aria-label="Midi — mise à jour actuelle">
            <circle cx="12" cy="12" r="5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <line x1="12" y1="1.5" x2="12" y2="4"/>
              <line x1="12" y1="20" x2="12" y2="22.5"/>
              <line x1="1.5" y1="12" x2="4" y2="12"/>
              <line x1="20" y1="12" x2="22.5" y2="12"/>
              <line x1="4.4" y1="4.4" x2="6.3" y2="6.3"/>
              <line x1="17.7" y1="17.7" x2="19.6" y2="19.6"/>
              <line x1="4.4" y1="19.6" x2="6.3" y2="17.7"/>
              <line x1="17.7" y1="6.3" x2="19.6" y2="4.4"/>
            </g>
          </svg>
          <span class="pulse-hour">12 h</span>
        </div>

        <!-- 16h : soleil couchant — après-midi -->
        <div class="pulse-icon" title="Mise à jour de 16 h">
          <svg class="celestial" viewBox="0 0 24 24" role="img" aria-label="Après-midi">
            <!-- Sinking sun -->
            <path d="M12 14a4 4 0 0 0 4-4 4 4 0 0 0-8 0 4 4 0 0 0 4 4z" fill="currentColor"/>
            <!-- Upper and side rays only -->
            <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
              <line x1="12" y1="4" x2="12" y2="1.5"/>
              <line x1="6.3" y1="5.3" x2="4.2" y2="3.2"/>
              <line x1="17.7" y1="5.3" x2="19.8" y2="3.2"/>
              <line x1="4" y1="10" x2="1.5" y2="10"/>
              <line x1="20" y1="10" x2="22.5" y2="10"/>
            </g>
            <!-- Water/horizon lines -->
            <line x1="3" y1="14" x2="21" y2="14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="6" y1="17" x2="18" y2="17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span class="pulse-hour">16 h</span>
        </div>

        <!-- 20h : croissant inversé — soir -->
        <div class="pulse-icon" title="Mise à jour de 20 h">
          <svg class="celestial" viewBox="0 0 24 24" role="img" aria-label="Soir">
            <g transform="translate(24,0) scale(-1,1)">
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="currentColor"/>
            </g>
          </svg>
          <span class="pulse-hour">20 h</span>
        </div>
      </div>

      <div class="edition-block">
        <div class="edition-line">
          <span class="edition-name" id="edition-name">Édition de la soirée</span>
          <span class="edition-sep">·</span>
          <span class="edition-region">Québec</span>
        </div>
        <div class="pulse-countdown">
          <span class="cd-prefix">Prochaine mise à jour dans</span>
          <span class="cd-live" aria-hidden="true" title="Le cœur du site bat à chaque seconde"></span>
          <span class="cd-big" id="cd-big">3 h 45 min</span>
        </div>
      </div>
    </div>

    <!-- Droite : liens + prochaine mise à jour -->
    <div class="header-utility">
      <div class="utility-stack">
        <nav class="sub-nav">
          <div class="links">
            <a href="methodologie/">Méthodologie</a>
            <span class="nav-divider" aria-hidden="true"></span>
            <a href="apropos/">À propos</a>
          </div>
        </nav>

        <!-- Rythme de mise à jour, en clair -->
        <div class="pulse-title">
          <div class="pt-primary">Les analyses des médias s'actualisent <em>six fois par jour</em></div>
          <div class="pt-secondary">Celles des discours de l'Assemblée nationale, <em>chaque jour de débat</em></div>
        </div>
      </div>
    </div>

  </div>
  <!-- Une des unes + Deux solitudes : hydraté par UneDesUnesSection (Server Component) -->
