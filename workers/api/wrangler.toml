name = "vitrine-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Le pilote Neon parle HTTP, pas TCP : pas besoin de nodejs_compat ni de
# Hyperdrive. C'est ce qui rend l'API déployable sans autre infrastructure.

[vars]
# Durée de cache des réponses, calée sur le cycle de rafraîchissement des
# données (4 h). C'est la pièce qui rend l'API insensible à la charge :
# Postgres ne voit qu'une poignée de requêtes par fenêtre, que l'API serve dix
# clients ou dix mille.
CACHE_TTL_SECONDS = "14400"

# Identité de l'administration. Ces deux valeurs ne sont pas des secrets — le
# `aud` figure déjà dans l'URL de redirection d'Access — mais elles sont
# INDISPENSABLES : sans elles, /admin refuse de répondre, par choix.
ACCESS_TEAM_DOMAIN = "capp-vitrine.cloudflareaccess.com"
ACCESS_AUD = "8217d6f3af04da4d6185d6ba20db7c1654b16ad545010eb8f84dddd9ffe1e219"

# Sync DIRECT Athena (chaîne émancipée de GitHub, cron de la minute :10).
# 'false' = phase d'ombre : on écrit Postgres, aucun build déclenché. La
# bascule consiste à passer cette valeur à "true" (et à poser les secrets
# DEPLOY_HOOK_PROD / DEPLOY_HOOK_DEV).
SYNC_TRIGGER_DEPLOYS = "false"
# Coordonnées Athena (non secrètes) : base Glue des datamarts DEV et
# compartiment de résultats, les mêmes que ceux que `tube` résout.
ATHENA_REGION = "ca-central-1"
ATHENA_DATABASE = "gluestackdatamartdbd046f685"
ATHENA_OUTPUT = "s3://pipeline-stack-athenaqueryresultsbucket6f63bbe4-1hrrrojv867l3/"

# Secrets à poser hors du dépôt :
#   wrangler secret put DATABASE_URL
#   wrangler secret put AWS_ACCESS_KEY_ID_DEV      (clé de LECTURE Athena)
#   wrangler secret put AWS_SECRET_ACCESS_KEY_DEV  (idem)
#   wrangler secret put SLACK_WEBHOOK_URL          (optionnel, alertes)
#   wrangler secret put DEPLOY_HOOK_PROD           (à la bascule)
#   wrangler secret put DEPLOY_HOOK_DEV            (à la bascule)

# Recharge Postgres depuis les JSON publiés.
#
# HORAIRE VISÉ : 02:00, 06:00, 10:00, 14:00, 18:00, 22:00 HEURE DE NEW YORK,
# fixe toute l'année, sans intervention.
#
# Pourquoi 02:00 et pas minuit : refresh-data.yml part à :50 et dure plusieurs
# minutes — Athena, illustration, musique, commit. On lit 70 minutes plus tard,
# une fois les données atterries.
#
# POURQUOI DOUZE HEURES POUR SIX EXÉCUTIONS : le cron Cloudflare est en UTC, et
# UTC ignore l'heure avancée. On enregistre donc les deux jeux — 2,6,10,14,18,22
# (valables l'été) et 3,7,11,15,19,23 (valables l'hiver) — et `isTargetHourInNY`
# dans src/sync.ts laisse passer seulement ceux qui tombent sur une heure visée
# à New York. Les six autres ressortent immédiatement.
#
# L'alternative était de changer cette ligne deux fois par an. Un rappel
# semestriel finit toujours par être oublié, et l'oubli est silencieux.
[triggers]
# Deux crons, distingués par leur MINUTE dans src/index.ts :
#   :00 = ancien chemin (JSON publiés -> Postgres), filet de la phase d'ombre ;
#   :10 = sync DIRECT Athena -> Postgres (chaîne émancipée de GitHub),
#         heures visées {0,4,8,12,16,20} à New York, mêmes deux jeux UTC
#         été/hiver, garde-fou isAthenaTargetHourInNY (src/schedule.ts).
crons = [
  "0 2,3,6,7,10,11,14,15,18,19,22,23 * * *",
  "10 0,1,4,5,8,9,12,13,16,17,20,21 * * *",
]
