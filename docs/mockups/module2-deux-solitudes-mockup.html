<style>
:root{--paper:#F3ECDD;--paper-deep:#ECE3CF;--ink:#231F1C;--ink-soft:#433F38;--ink-softer:#6E685F;--rule:#C8BDA6;--rule-faint:#DED3B9;--cordovan:#6B1E2A;--brass:#A07A3D;--red:#A8302C;--bleu:#2E4663;--ocre:#6D5A2F}
*{box-sizing:border-box}
body{margin:0;background:#e7ddc7;color:var(--ink);font-family:'Source Serif 4',Georgia,serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
.wrap{width:100%;max-width:1180px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:18px;justify-content:center;flex-wrap:wrap}
.toolbar .lab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-softer)}
.toolbar button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:2px}
.toolbar button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.solitudes{border:.5px solid var(--rule);background:var(--paper-deep);padding:40px 44px 36px;text-align:center}
.sol-title{font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:700;margin:0 0 22px;letter-spacing:-.5px}
/* Radar « qui parle de quoi » — 2 ombrages QC (bleu) / CAN (rouge), axes = actualités du bloc */
.sol-radar{max-width:640px;margin:0 auto 4px}
.sol-radar svg{display:block;width:100%;height:auto}
.radar-grid{fill:none;stroke:var(--rule);stroke-width:.7}
.radar-spoke{stroke:var(--rule-faint);stroke-width:.7}
.radar-qc{fill:rgba(46,70,99,.30);stroke:var(--bleu);stroke-width:1.6;stroke-linejoin:round}
.radar-can{fill:rgba(168,48,44,.24);stroke:var(--red);stroke-width:1.6;stroke-linejoin:round}
.radar-dot-qc{fill:var(--bleu)} .radar-dot-can{fill:var(--red)}
.radar-lab{font-family:'Source Serif 4',Georgia,serif;font-size:12.5px;fill:var(--ink-soft)}

.sol-legend{display:flex;justify-content:center;gap:26px;align-items:center;margin:0 0 10px}

.sol-legend .li.qc{color:var(--bleu)} .sol-legend .li.can{color:var(--red)}

.sol-legend .sw.can{background:rgba(168,48,44,.24);box-shadow:inset 0 0 0 1.5px var(--red)}
.sol-legend .glyph{font-size:17px;line-height:1;filter:grayscale(1) brightness(.34) contrast(1.5)}
.sol-legend svg{display:inline-block;vertical-align:middle}
.sol-stat{display:flex;flex-direction:column;align-items:center;gap:9px;margin:4px 0 14px}
.mode-word{font-family:'Playfair Display',Georgia,serif;font-size:52px;font-weight:900;line-height:1;letter-spacing:-.8px}
.mode-div{color:var(--cordovan)} .mode-divp{color:#9A5A3C} .mode-convp{color:#4E6374} .mode-con{color:var(--bleu)}
.mode-detail{font-style:italic;font-size:18px;color:var(--ink-softer)} .mode-detail strong{font-size:27px;color:var(--ink);font-style:normal}

.rel-line{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--ink-soft);margin-top:2px}
.rel-line strong{font-weight:600;color:var(--ink)}
.rel-strip{position:relative;width:260px;height:22px;margin:6px auto 0}
.rel-strip .track{position:absolute;top:10px;left:0;right:0;height:1px;background:var(--rule)}
.rel-strip .tick{position:absolute;top:7px;width:1px;height:7px;background:var(--rule)}
.rel-strip .tick.median{top:5px;height:11px;background:var(--ink-softer)}
.rel-strip .marker{position:absolute;top:10px;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);transition:left .6s ease}
.rel-strip .lbl{position:absolute;top:-11px;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-softer)}
.rel-strip .lbl.l{left:0} .rel-strip .lbl.r{right:0} .rel-strip .lbl.m{left:50%;transform:translateX(-50%)}
.sol-note{font-family:'Source Serif 4',serif;font-style:italic;font-size:12.5px;color:var(--ink-softer);margin:10px auto 0;max-width:560px}
.block{max-width:880px;margin:0 auto;text-align:left;border-top:1px solid var(--rule);padding-top:18px}
.block+.block{margin-top:8px;padding-top:20px}
.block-title{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-softer);margin:0 0 16px}
.ev{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:.5px solid var(--rule)}.ev:last-child{border-bottom:0}
.ev .rk{font-family:'Playfair Display',serif;font-size:22px;color:var(--ink-softer);min-width:24px}.ev .body{flex:1}
.ev .ttl{font-size:17px;line-height:1.35}.ev .meta{margin-top:8px}
.saillance-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;padding:5px 12px;line-height:1.2;vertical-align:middle}
.saillance-tag.s-extreme{background:var(--cordovan);color:var(--paper);font-size:12.5px;font-weight:600;padding:6px 15px;letter-spacing:.28em}
.saillance-tag.s-tres-eleve{background:var(--red);color:var(--paper)}
.saillance-tag.s-eleve{background:var(--brass);color:var(--paper)}
.saillance-tag.s-moyenne{background:transparent;color:var(--ink-soft);box-shadow:inset 0 0 0 1px var(--ink-soft)}
.saillance-tag.s-faible{background:transparent;color:var(--ink-softer);box-shadow:inset 0 0 0 1px var(--rule)}
.byline{margin-top:9px}
.byline .lbl{font-family:'Source Serif 4',serif;font-style:italic;font-size:11px;color:var(--ink-softer);margin-right:6px}
.byline-media{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.byline-media a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}

.topic-label{font-family:'Playfair Display',serif;font-size:19px;margin:18px 0 10px}.topic-label:first-child{margin-top:0}
.shared{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule)}
.shared .col{padding:15px 17px}.shared .col:first-child{border-right:1px solid var(--rule)}
.shared .colhead{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-softer);margin-bottom:9px}
.shared .ttl{font-size:16px;line-height:1.35;margin-bottom:11px}
.shared .saillance-tag{margin:0}

 ], "shared": [{"topic": "Éclosion d'hantavirus en Colombie-Britannique", "qc_title": "Hantavirus : un cas confirmé parmi les personnes isolées à Victoria", "can_title": "Un Canadien en isolement en C.-B. obtient un résultat « présomptif positif » à l'hantavirus", "qc_sail": "Extrême", "can_sail": "Très élevée", "qc_media": ["Journal de Montréal", "La Presse", "Le Devoir", "Radio-Canada"], "can_media": ["CBC", "The Globe and Mail", "Vancouver Sun"]}]}, "multi": {"date": "29 mai · 8 h – 12 h", "conv": 36, "pct": 81, "cov_qc": 39, "cov_can": 31,
 "axes": [

  {"label":"Rentrée à l'Assemblée","qc":12,"can":2}
 ], "can": [{"title": "Le PIB du Canada dévoilera l'impact de la guerre en Iran sur l'économie", "sail": "Modérée", "media": ["Global News"]}, {"title": "Pénurie de lits : des patients soignés dans des lieux insolites en Ontario", "sail": "Modérée", "media": ["National Post"]}], "shared": [{"topic": "Le Canada en récession technique", "qc_title": "Le Canada entre en récession technique alors que l’économie stagne au 1er trimestre", "can_title": "Le Canada glisse en récession technique, la croissance stagne au 1er trimestre", "qc_sail": "Faible", "can_sail": "Élevée", "qc_media": ["Le Devoir", "Radio-Canada"], "can_media": ["CBC", "CTV", "Global News"]}, {"topic": "Drone russe en Roumanie", "qc_title": "La Roumanie affirme qu’un drone russe a frappé un immeuble sur son territoire", "can_title": "Un drone russe frappe la Roumanie, membre de l’OTAN, faisant deux blessés", "qc_sail": "Faible", "can_sail": "Faible", "qc_media": ["Radio-Canada"], "can_media": ["The Globe and Mail"]}]}}; const FLEUR=`<svg viewBox="-0.864 -0.333 350 359" height="58" width="57" aria-label="Québec"><g fill="#231F1C"><path d="M297.69,147.804c-47.642-5.459-97.763,27.791-107.192,94.289c-0.329,2.318-0.605,4.685-0.824,7.076h-2.81

	h-8.065c-7.608,0-13.776,4.469-13.776,9.983c0,5.514,6.168,9.983,13.776,9.983h9.817c-0.803,4.348-2.456,8.464-5.034,12.162

const SCLS={"Extrême":"s-extreme","Très élevée":"s-tres-eleve","Élevée":"s-eleve","Modérée":"s-moyenne","Faible":"s-faible","Très faible":"s-tres-faible"};
function tag(s){return `<span class="saillance-tag ${SCLS[s]||'s-faible'}">Saillance ${s.toLowerCase()}</span>`;}
function pos(conv){const div=100-conv;const gap=8+82*Math.pow(div/100,1.4);return [50-gap/2, 50+gap/2];}
function byl(label,media){if(!media||!media.length)return '';
  return `<div class="byline"><span class="lbl">${label}</span><span class="byline-media">`+media.map(m=>`<a href="#">${m}</a>`).join('<span class="sep">·</span>')+`</span></div>`;}
function blk(title,inner){return `<div class="block"><p class="block-title">${title}</p>${inner}</div>`;}
// Lecture relative (feedback Yannick) : « plus ou moins que d'hab, et de combien ».
// pct = percentile de convergence dans la fenêtre glissante.
function relSentence(pct){
  if(pct>=99) return `Le bloc le plus convergent des <strong>six derniers mois</strong>`;
  if(pct>=60) return `Plus convergent que <strong>${pct}&nbsp;%</strong> des blocs des six derniers mois`;
  if(pct<=40) return `Plus divergent que <strong>${100-pct}&nbsp;%</strong> des blocs des six derniers mois`;
  return `Dans la norme des six derniers mois — la divergence est la règle`;
}
// Radar « qui parle de quoi » : N axes = actualités du bloc, 2 polygones
// QC (bleu) / CAN (rouge). Échelle commune normalisée sur le max des 2 séries.
function radar(axes){
  const W=560,H=360,CX=W/2,CY=H/2+4,R=128,R0=6;
  const n=axes.length, max=Math.max(...axes.flatMap(a=>[a.qc,a.can]),1);
  const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const r=R0+(v/max)*(R-R0);
    return [CX+r*Math.cos(ang), CY+r*Math.sin(ang)];};
  const ring=f=>'<polygon class="radar-grid" points="'+axes.map((_,i)=>{
    const ang=-Math.PI/2+i*2*Math.PI/n;const r=R0+f*(R-R0);
    return (CX+r*Math.cos(ang)).toFixed(1)+','+(CY+r*Math.sin(ang)).toFixed(1);}).join(' ')+'"/>';
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,max);
    return `<line class="radar-spoke" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;}).join('');
  const poly=(cls,key)=>'<polygon class="'+cls+'" points="'+axes.map((a,i)=>pt(i,a[key]).map(c=>c.toFixed(1)).join(',')).join(' ')+'"/>';
  const dots=(cls,key)=>axes.map((a,i)=>{const [x,y]=pt(i,a[key]);
    return a[key]>0?`<circle class="${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/>`:'';}).join('');
  const labels=axes.map((a,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;
    const lx=CX+(R+16)*Math.cos(ang), ly=CY+(R+16)*Math.sin(ang);
    const anchor=Math.abs(Math.cos(ang))<.35?'middle':(Math.cos(ang)>0?'start':'end');
    const dy=Math.abs(Math.sin(ang))<.35?4:(Math.sin(ang)>0?11:-4);
    const strong=Math.max(a.qc,a.can)===max?' strong':'';
    return `<text class="radar-lab${strong}" x="${lx.toFixed(1)}" y="${(ly+dy).toFixed(1)}" text-anchor="${anchor}">${a.label}</text>`;}).join('');
  return `<div class="sol-radar"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Qui parle de quoi : saillance de chaque actualité au Québec et au Canada">
    ${ring(1)}${ring(2/3)}${ring(1/3)}${spokes}
    ${poly('radar-can','can')}${poly('radar-qc','qc')}
    ${dots('radar-dot-can','can')}${dots('radar-dot-qc','qc')}
    ${labels}</svg></div>`;
}
function legend(){
  const fleurBleue=FLEUR.replace('height="58" width="57"','height="18" width="18"').replace('fill="#231F1C"','fill="#2E4663"');
  return `<div class="sol-legend">
    <span class="li qc">${fleurBleue}<span class="sw qc"></span> Québec</span>
    <span class="li can"><span class="glyph">&#127809;</span><span class="sw can"></span> Canada</span></div>`;
}
function relStrip(pct,modeCls){

  return `<div class="rel-strip" aria-hidden="true">
    <span class="lbl l">divergent</span><span class="lbl m">habituel</span><span class="lbl r">convergent</span>

}
function render(state){
  ['divergent','convergent','haute','multi'].forEach(s=>document.getElementById('b_'+s).classList.toggle('active',s===state));
  const o=D[state], div=100-o.conv;
  const c=o.conv;const mode=c<25?['Divergence','mode-div']:(c<50?['Divergence partielle','mode-divp']:(c<75?['Convergence partielle','mode-convp']:['Convergence','mode-con']));
  const verb=o.conv<50?'diverge':'converge', val=o.conv<50?div:o.conv;
  const [qp,rp]=pos(o.conv);
  let sections='';
  if(o.can){
    const inner=o.can.map((e,i)=>`<div class="ev"><span class="rk">${i+1}</span><div class="body"><div class="ttl">${e.title}</div>
      <div class="meta">${tag(e.sail)}</div>${byl('À lire au Canada sur',e.media)}</div></div>`).join('');
    sections+=blk('À la Une au Canada', inner);
  }
  if(o.shared){
    const inner=o.shared.map(s=>`<p class="topic-label">◆ ${s.topic}</p><div class="shared">
      <div class="col"><div class="colhead">Au Québec</div><div class="ttl">${s.qc_title}</div>${tag(s.qc_sail)}${byl('À lire sur',s.qc_media)}</div>
      <div class="col"><div class="colhead">Au Canada</div><div class="ttl">${s.can_title}</div>${tag(s.can_sail)}${byl('À lire sur',s.can_media)}</div></div>`).join('');
    sections+=blk(o.can?'Aussi couvert des deux côtés':'Le même sujet, couvert des deux côtés', inner);
  }
  document.getElementById('mod').innerHTML=`<section class="solitudes"><h3 class="sol-title">Deux solitudes&nbsp;?</h3>
    ${legend()}
    ${radar(o.axes)}
    <div class="sol-stat"><span class="mode-word ${mode[1]}" title="Mesure : les mêmes SUJETS saillants des deux côtés (personnes, lieux, organisations), pas les mêmes articles.">${mode[0]}</span>
      <span class="mode-detail">L'actualité ${verb} à <strong title="0 % = aucun sujet saillant partagé · 100 % = mêmes priorités des deux côtés">${val}&nbsp;%</strong></span>
      <span class="rel-line">${relSentence(o.pct)}</span>
      ${relStrip(o.pct,mode[1])}
      <span class="sol-note">Le Québec consacre ${o.cov_qc}&nbsp;% de son attention à des sujets aussi saillants au Canada&nbsp;; le Canada, ${o.cov_can}&nbsp;% aux sujets saillants au Québec.</span></div>
    ${sections}</section>`;
  document.getElementById('cap').textContent='Bloc '+o.date+' · listes = données réelles (Athena DEV) · radar : valeurs indicatives pour la démo (prod = salience par sujet, salient_index) · indice = cosinus-objet pondéré saillance (sans IDF), stoplist géo · lecture relative = percentile sur fenêtre glissante';
}
render('divergent');
</script></body></html>
