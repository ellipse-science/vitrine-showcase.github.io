<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3ECDD;--paper-deep:#ECE3CF;--ink:#231F1C;--ink-soft:#433F38;--ink-softer:#6E685F;--rule:#C8BDA6;--rule-faint:#DED3B9;--cordovan:#6B1E2A;--brass:#A07A3D;--red:#A8302C;--bleu:#2E4663;--ocre:#6D5A2F}
*{box-sizing:border-box}
body{margin:0;background:#e7ddc7;color:var(--ink);font-family:'Source Serif 4',Georgia,serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
/* Grain papier (Financial Times / Monocle) : bruit fractal très discret
   par-dessus tout, en multiply — enlève l'effet « page HTML » */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
.wrap{width:100%;max-width:1180px;position:relative;z-index:1}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:18px;justify-content:center;flex-wrap:wrap}
.toolbar .lab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-softer)}
.toolbar button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 13px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:2px}
.toolbar button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Grandes marges : esthétique affiche éditoriale, pas dashboard */
.solitudes{border:.5px solid var(--rule);background:var(--paper-deep);padding:64px 56px 56px;text-align:center}
.sol-title{font-family:'Playfair Display',Georgia,serif;font-size:40px;font-weight:900;margin:0 0 10px;letter-spacing:-.6px}
.sol-sub{font-style:italic;font-size:15.5px;line-height:1.5;color:var(--ink-softer);margin:0 auto 34px;max-width:480px}
.sol-sub .when{font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;display:block;margin-top:7px;color:var(--ink-soft)}

/* Axe bipolaire : ligne graduée bleu → neutre → rouge, symboles mobiles */
.sol-viz{position:relative;height:122px;max-width:760px;margin:0 auto 30px}
.sol-axis{position:absolute;top:50%;left:0;right:0;height:2px;transform:translateY(-50%);
  background:linear-gradient(90deg,rgba(46,70,99,.5) 0%,rgba(46,70,99,.16) 25%,var(--rule-faint) 45%,var(--rule-faint) 55%,rgba(168,48,44,.16) 75%,rgba(168,48,44,.5) 100%)}
.sol-symbol{position:absolute;top:50%;transform:translate(-50%,-50%);background:var(--paper-deep);padding:0 14px;transition:left .6s ease;text-align:center}
.sol-symbol svg{display:block;margin:0 auto}
/* Silhouette plate rouge brique : emoji transparent, l'ombre portée (blur 0)
   dessine la forme dans la couleur du radar */
.glyph-maple{font-size:50px;line-height:58px;height:58px;display:block;color:transparent;text-shadow:0 0 0 var(--red)}
.caption{display:block;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-softer)}
/* Flèches de mouvement, plus affirmées : s'éloignent quand ça diverge,
   se rapprochent quand ça converge. Toujours à l'extérieur des symboles. */
.sol-arrow{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:27px;font-weight:700;padding:0 6px;transition:left .6s ease;line-height:1}
.sol-arrow.qc{color:var(--bleu)} .sol-arrow.can{color:var(--red)}
.sol-arrow.dL{animation:driftL 2.2s ease-in-out infinite}
.sol-arrow.dR{animation:driftR 2.2s ease-in-out infinite}
@keyframes driftL{50%{transform:translate(calc(-50% - 5px),-50%)}}
@keyframes driftR{50%{transform:translate(calc(-50% + 5px),-50%)}}

/* Radar : halo qui fixe le regard, grille effacée, surfaces dominantes */
.sol-radar{max-width:760px;margin:0 auto 4px}
.sol-radar svg{display:block;width:100%;height:auto;overflow:visible}
.radar-halo{fill:rgba(35,31,28,.045)}
.radar-grid{fill:none;stroke:rgba(35,31,28,.10);stroke-width:.7}
.radar-spoke{stroke:rgba(35,31,28,.07);stroke-width:.7}
.radar-qc{fill:rgba(46,70,99,.32);stroke:var(--bleu);stroke-width:1.7;stroke-linejoin:round}
.radar-can{fill:rgba(168,48,44,.26);stroke:var(--red);stroke-width:1.7;stroke-linejoin:round}
.dot .hit{fill:transparent;cursor:pointer}
.dot .pip{pointer-events:none;transform-box:fill-box;transform-origin:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.dot:hover .pip{transform:scale(2.3)}
.dot.radar-dot-qc .pip{fill:var(--bleu)} .dot.radar-dot-can .pip{fill:var(--red)}
/* Infobulle des points, pilotée en JS (le <title> SVG natif est lent et
   peu fiable). Suit le curseur, apparaît instantanément. */
.dot-tip{position:fixed;z-index:60;max-width:260px;background:var(--ink);color:var(--paper);font-family:'Source Serif 4',Georgia,serif;font-size:14px;line-height:1.45;padding:10px 13px;border-radius:3px;box-shadow:0 3px 14px rgba(35,31,28,.28);pointer-events:none;opacity:0;transition:opacity .12s ease}
.dot-tip.on{opacity:1}
.dot-tip .k{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.dot-tip.qc .k{color:#9DB4D0} .dot-tip.can .k{color:#E6A6A2}
/* Étiquettes colorées par camp dominant : bleu = plus discuté au Québec,
   rouge = plus discuté au Canada */
.radar-lab.side-qc,.radar-lab.strong.side-qc{fill:var(--bleu)}
.radar-lab.side-can,.radar-lab.strong.side-can{fill:var(--red)}
/* Entrée « Bloomberg » : le rouge paraît, puis le bleu, puis le score */
.radar-can,.radar-dot-can{transform-box:fill-box;transform-origin:center;animation:polyIn .5s ease .08s both}
.radar-qc,.radar-dot-qc{transform-box:fill-box;transform-origin:center;animation:polyIn .5s ease .34s both}
@keyframes polyIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.radar-lab{font-family:'Source Serif 4',Georgia,serif;font-size:16px;fill:var(--ink-soft)}
.radar-lab.strong{font-weight:600}

/* Badges médias : carrés monochromes identiques (le luxe est dans
   l'uniformité), cliquables vers le dernier article du média sur le sujet.
   Survol : inversion encre/papier + nom complet en byline. */
.m-chip rect{fill:var(--paper);stroke:var(--ink-soft);stroke-width:.9;rx:2}
.m-chip text{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.05em;font-weight:600;fill:var(--ink-soft);text-anchor:middle}
.m-chip g{transform-box:fill-box;transform-origin:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.m-chip:hover g{transform:scale(1.3)}
.m-chip:hover rect{fill:var(--ink);stroke:var(--ink)}
.m-chip:hover text:not(.m-name){fill:var(--paper)}
.m-chip .m-name{opacity:0;pointer-events:none;transition:opacity .15s ease;font-size:9.5px;letter-spacing:.09em;fill:var(--ink)}
.m-chip:hover .m-name{opacity:1}

/* Le score, signature Radar+ : énorme chiffre, libellé dessous */
.sol-stat{display:flex;flex-direction:column;align-items:center;gap:0;margin:18px 0 0;animation:fadeUp .5s ease .62s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.score-num{font-family:'Playfair Display',Georgia,serif;font-size:88px;font-weight:900;line-height:.95;letter-spacing:-2px}
.score-num sup{font-size:40px;letter-spacing:0;vertical-align:14px}
.score-lab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);margin-top:10px}
.mode-div{color:var(--cordovan)} .mode-divp{color:#9A5A3C} .mode-convp{color:#4E6374} .mode-con{color:var(--bleu)}
/* Bulle d'info éditoriale (pattern des bulles du module 1) : la phrase
   apparaît au survol/focus du ⓘ à côté du libellé du score */
.info-dot{position:relative;display:inline-block;margin-left:9px;font-size:15px;letter-spacing:0;color:var(--ink-softer);cursor:help;vertical-align:1px}
.info-dot:hover,.info-dot:focus{color:var(--ink)}
.info-bubble{position:absolute;bottom:calc(100% + 22px);left:50%;transform:translateX(-50%);width:400px;max-width:88vw;background:var(--paper);border:1px solid var(--rule);box-shadow:0 3px 16px rgba(35,31,28,.16);padding:20px 24px;font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.6;letter-spacing:0;text-transform:none;color:var(--ink-soft);opacity:0;pointer-events:none;transition:opacity .15s ease;z-index:6}
/* Flèche du bas, sous le cadre, qui ne le fait pas chevaucher le texte */
.info-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--paper);filter:drop-shadow(0 1px 0 var(--rule))}
.info-dot:hover .info-bubble,.info-dot:focus .info-bubble{opacity:1}

/* Jauge : gradient rouge → neutre → bleu, point plein */
.rel-strip{position:relative;width:320px;height:44px;margin:26px auto 0}
.rel-strip .track{position:absolute;top:30px;left:0;right:0;height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--red),var(--rule) 38%,var(--rule) 62%,var(--bleu))}
.rel-strip .tick{position:absolute;top:26px;width:1px;height:11px;background:rgba(35,31,28,.28)}
.rel-strip .marker{position:absolute;top:31.5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--paper-deep);transform:translate(-50%,-50%);transition:left .6s ease;box-shadow:0 0 0 1px rgba(35,31,28,.25)}
.rel-strip .lbl{position:absolute;top:0;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-softer)}
.rel-strip .lbl.l{left:0;color:var(--red)} .rel-strip .lbl.r{right:0;color:var(--bleu)}
.rel-strip .lbl.m{left:50%;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){.sol-arrow,.radar-can,.radar-qc,.radar-dot-can,.radar-dot-qc,.sol-stat{animation:none !important}}
/* Mobile : symboles et typographie réduits, rien ne se rogne à ~320-640px */
@media (max-width:640px){
  .solitudes{padding:40px 20px 36px}
  .sol-viz{height:92px;margin-bottom:18px}
  .sol-symbol{padding:0 6px}
  .sol-symbol svg{height:40px;width:39px}
  .glyph-maple{font-size:34px;line-height:40px;height:40px}
  .caption{font-size:8px;letter-spacing:.14em;margin-top:6px}
  .sol-title{font-size:28px}
  .sol-arrow{font-size:21px}
  .score-num{font-size:56px}.score-num sup{font-size:26px;vertical-align:9px}
  .edito{font-size:15px}
  .radar-lab{font-size:11px}
}

// ÉCHELLE RADIALE DU RADAR = percentile de saillance de l'événement dans la
// distribution des Unes publiées de SA région (headline_events_4h,
// historique complet depuis 2026-05-14). Défendable métho : même famille
// que l'étiquette de saillance (#35, percentiles) et que la lecture
// relative (Yannick 2026-06-08). Corrige le biais d'échelle brute
// (ROC ≈ 2× QC : panels et salient_index différents — cf. #143).
// Calibration RÉELLE (Athena DEV, 2026-07-13, n=953 Unes QC / 954 CAN) :
const CAL_QC =[[0,0],[7.4,5],[11,20],[18.2,50],[30.6,80],[63.8,95],[193.4,100]];
const CAL_ROC=[[0,0],[15.3,5],[22,20],[39,50],[68.5,80],[128.9,95],[293.4,100]];
function pctile(v,cal){
  if(!(v>0)) return 0;
  for(let i=1;i<cal.length;i++){ if(v<=cal[i][0]){
    const [x0,y0]=cal[i-1],[x1,y1]=cal[i];
    return y0+(v-x0)/(x1-x0)*(y1-y0); } }
  return 100;
}
// Badges monochromes identiques (carrés) — initiales courtes par média.
const MEDIA_BADGE={LED:'LD',LAP:'LP',RCI:'RC',TVA:'TVA',JDM:'JdM',MG:'MG',CBC:'CBC',CTV:'CTV',GN:'GN',TTS:'TS',GAM:'GM',NP:'NP',VS:'VS'};
const MEDIA_FULL={LED:'Le Devoir',LAP:'La Presse',RCI:'Radio-Canada',TVA:'TVA Nouvelles',JDM:'Journal de Montréal',MG:'Montreal Gazette',CBC:'CBC',CTV:'CTV News',GN:'Global News',TTS:'Toronto Star',GAM:'The Globe and Mail',NP:'National Post',VS:'Vancouver Sun'};

// gap minimal 15 % : à convergence maximale les symboles se touchent
// (« collés ») sans se masquer ni fusionner leurs légendes.
function pos(conv){const div=100-conv;const gap=18+72*Math.pow(div/100,1.4);return [50-gap/2, 50+gap/2];}

// Radar « qui parle de quoi » : axes = événements saillants du bloc,
// 2 polygones QC (bleu) / CAN (rouge).
function radar(axes){
  const W=640,H=470,CX=W/2,CY=H/2,R=150,R0=6;
  // Valeurs radiales = PERCENTILES dans la distribution de chaque région
  // (échelle fixe 0-100, anneaux = p25/p50/p75). Pas de normalisation par
  // le max du bloc : la grille garde le même sens d'un bloc à l'autre.
  const vals=axes.map(a=>({vqc:pctile(a.qc,CAL_QC), vcan:pctile(a.can,CAL_ROC)}));
  const n=axes.length;
  const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/n;const r=R0+(v/100)*(R-R0);
    return [CX+r*Math.cos(ang), CY+r*Math.sin(ang)];};
  const ring=f=>'<polygon class="radar-grid" points="'+axes.map((_,i)=>{
    const ang=-Math.PI/2+i*2*Math.PI/n;const r=R0+f*(R-R0);
    return (CX+r*Math.cos(ang)).toFixed(1)+','+(CY+r*Math.sin(ang)).toFixed(1);}).join(' ')+'"/>';
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,100);
    return `<line class="radar-spoke" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;}).join('');
  const poly=(cls,key)=>'<polygon class="'+cls+'" points="'+vals.map((v,i)=>pt(i,v[key]).map(c=>c.toFixed(1)).join(',')).join(' ')+'"/>';
  // Points cliquables au survol : zoom + explication claire de la valeur
  // (événement, percentile dans SA région, score brut).
  const dots=(cls,key)=>vals.map((v,i)=>{const [x,y]=pt(i,v[key]);
    if(!(v[key]>0)) return '';
    const side=key==='vqc'?'qc':'can';
    const region=key==='vqc'?'québécoises':'canadiennes';
    const kk=key==='vqc'?'Au Québec':'Au Canada';
    const tip=`${axes[i].label} : plus saillant que ${Math.round(v[key])} % des Unes ${region} des six derniers mois.`;
    return `<g class="dot ${cls}" data-side="${side}" data-k="${kk}" data-tip="${tip.replace(/"/g,'&quot;')}">
      <circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13"/>
      <circle class="pip" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8"/></g>`;}).join('');
  const maxVal=Math.max(...vals.flatMap(v=>[v.vqc,v.vcan]),1);
  const wrapLab=s=>{
    if(s.length<=19) return [s];
    const mid=Math.floor(s.length/2);
    let best=-1;
    for(let j=0;j<s.length;j++) if(s[j]===' ' && (best<0||Math.abs(j-mid)<Math.abs(best-mid))) best=j;
    return best<0?[s]:[s.slice(0,best),s.slice(best+1)];
  };
  const labels=axes.map((a,i)=>{const ang=-Math.PI/2+i*2*Math.PI/n;
    const lx=CX+(R+15)*Math.cos(ang), ly=CY+(R+15)*Math.sin(ang);
    const anchor=Math.abs(Math.cos(ang))<.35?'middle':(Math.cos(ang)>0?'start':'end');
    const dy=Math.abs(Math.sin(ang))<.35?4:(Math.sin(ang)>0?12:-6);
    const lines=wrapLab(a.label);
    const strong=Math.max(vals[i].vqc,vals[i].vcan)===maxVal?' strong':'';
    const side=vals[i].vqc>=vals[i].vcan?' side-qc':' side-can';
    const BW=20, CHGAP=5;
    const chips=(a.media||[]).map(m=> typeof m==='string'?{id:m,url:'#'}:m);
    const tot=chips.length*BW+(chips.length-1)*CHGAP;
    const rowX = anchor==='middle'? lx-tot/2 : (anchor==='start'? lx : lx-tot);
    const topSide = Math.sin(ang)<-.35;
    const labH = (lines.length-1)*14;
    // Ordre uniforme sur tous les axes : titre AU-DESSUS, badges médias
    // en dessous. Pour l'axe du haut, on remonte le bloc pour que les
    // badges (placés sous le titre) dégagent quand même le radar.
    const labY = topSide ? ly+dy-(labH+8+BW) : ly+dy;
    const rowY = labY+labH+8;
    const chipsSvg=chips.map((c,k)=>{
      const ext=c.url!=='#'?' target="_blank" rel="noopener"':'';
      const cx0=rowX+k*(BW+CHGAP);
      const nameY = rowY+BW+13;
      return `<a class="m-chip" href="${c.url}"${ext} aria-label="Dernier article de ${MEDIA_FULL[c.id]||c.id} sur ${a.label}"><g>
        <rect x="${cx0.toFixed(1)}" y="${rowY.toFixed(1)}" width="${BW}" height="${BW}" rx="2"/>
        <text x="${(cx0+BW/2).toFixed(1)}" y="${(rowY+BW/2+2.8).toFixed(1)}">${MEDIA_BADGE[c.id]||c.id}</text></g>
        <text class="m-name" x="${(cx0+BW/2).toFixed(1)}" y="${nameY.toFixed(1)}" text-anchor="middle">${(MEDIA_FULL[c.id]||c.id).toUpperCase()}</text></a>`;}).join('');
    const labSvg=lines.map((ln,k)=>`<text class="radar-lab${strong}${side}" x="${lx.toFixed(1)}" y="${(labY+k*14).toFixed(1)}" text-anchor="${anchor}">${ln}</text>`).join('');
    return labSvg+chipsSvg;}).join('');
  return `<div class="sol-radar"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Qui parle de quoi : saillance de chaque événement au Québec et au Canada, en percentile de sa région">
    <circle class="radar-halo" cx="${CX}" cy="${CY}" r="${R+10}"/>
    ${ring(1)}${ring(.75)}${ring(.5)}${ring(.25)}${spokes}
    ${poly('radar-can','vcan')}${poly('radar-qc','vqc')}
    ${dots('radar-dot-can','vcan')}${dots('radar-dot-qc','vqc')}
    ${labels}</svg></div>`;
}
function relStrip(pct,modeCls){
  const color={'mode-div':'var(--cordovan)','mode-divp':'#9A5A3C','mode-convp':'#4E6374','mode-con':'var(--bleu)'}[modeCls]||'var(--ink)';
  return `<div class="rel-strip" aria-hidden="true">
    <span class="lbl l">plus divergent</span><span class="lbl m" title="Échelle en percentiles des six derniers mois : le centre est la médiane — un bloc « habituel », même si l'actualité y diverge fortement en absolu (c'est la règle).">habituel</span><span class="lbl r">plus convergent</span>
    <div class="track"></div>
    <div class="tick" style="left:50%"></div>
    <div class="marker" style="left:${pct}%;background:${color}"></div></div>`;
}
function render(state){
  ['divergent','convergent','haute','multi','reel'].forEach(s=>document.getElementById('b_'+s).classList.toggle('active',s===state));
  const o=D[state], div=100-o.conv;
  const c=o.conv;const mode=c<25?['Divergence','mode-div']:(c<50?['Divergence partielle','mode-divp']:(c<75?['Convergence partielle','mode-convp']:['Convergence','mode-con']));
  const verb=o.conv<50?'divergence':'convergence', val=o.conv<50?div:o.conv;
  const [qp,rp]=pos(o.conv);
  document.getElementById('mod').innerHTML=`<section class="solitudes"><h3 class="sol-title">Deux solitudes&nbsp;?</h3>
    <p class="sol-sub">Les sujets qui dominent l'actualité québécoise et canadienne.</p>
    <div class="sol-viz"><div class="sol-axis"></div>
      <span class="sol-arrow qc ${o.conv<50?'dL':'dR'}" style="left:calc(${qp}% - 54px)">${o.conv<50?'&larr;':'&rarr;'}</span>
      <span class="sol-arrow can ${o.conv<50?'dR':'dL'}" style="left:calc(${rp}% + 54px)">${o.conv<50?'&rarr;':'&larr;'}</span>
      <div class="sol-symbol" style="left:${qp}%">${FLEUR}<span class="caption">Québec</span></div>
      <div class="sol-symbol" style="left:${rp}%"><span class="glyph-maple">&#127809;</span><span class="caption">Canada</span></div></div>
    ${radar(o.axes)}
    <div class="sol-stat">
      <span class="score-num ${mode[1]}" title="0 % = aucun sujet saillant partagé · 100 % = mêmes priorités des deux côtés. Mesure : les mêmes SUJETS saillants (personnes, lieux, organisations), pas les mêmes articles.">${val}<sup>%</sup></span>
      <span class="score-lab">de ${verb}<span class="info-dot" tabindex="0">&#9432;<span class="info-bubble">${o.edito}</span></span></span>
      ${relStrip(o.pct,mode[1])}</div></section>`;
  document.getElementById('cap').textContent='Bloc '+o.date+' · radar : distance au centre = PERCENTILE de saillance de l\'événement parmi les Unes de SA région (calibré sur 953 Unes QC / 954 CAN, headline_events_4h depuis 2026-05-14 ; anneaux = p25/p50/p75) · états démo : scores indicatifs · indice = cosinus-objet (sans IDF), stoplist géo · jauge = percentile de convergence, centre = médiane 6 mois';
}
render('divergent');

// Infobulle des points du radar, pilotée en JS (délégation sur #mod, qui
// persiste entre les rendus). Le <title> SVG natif était lent et souvent
// invisible ; ici la bulle suit le curseur et apparaît instantanément.
const tipEl=document.createElement('div');tipEl.className='dot-tip';document.body.appendChild(tipEl);
const mod=document.getElementById('mod');
function place(e){const pad=14;let x=e.clientX+16,y=e.clientY+16;
  const r=tipEl.getBoundingClientRect();
  if(x+r.width>innerWidth-pad)x=e.clientX-r.width-16;
  if(y+r.height>innerHeight-pad)y=e.clientY-r.height-16;
  x=Math.max(pad,x);y=Math.max(pad,y);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
mod.addEventListener('mouseover',e=>{const g=e.target.closest('.dot');if(!g)return;
  tipEl.innerHTML=`<span class="k">${g.dataset.k}</span>${g.dataset.tip}`;
  tipEl.className='dot-tip on '+g.dataset.side;place(e);});
mod.addEventListener('mousemove',e=>{if(tipEl.classList.contains('on')&&e.target.closest('.dot'))place(e);});
mod.addEventListener('mouseout',e=>{if(e.target.closest('.dot'))tipEl.classList.remove('on');});
</script></body></html>
