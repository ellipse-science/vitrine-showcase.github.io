# Projet Xcode décrit en texte, généré par XcodeGen (`xcodegen generate`).
#
# POURQUOI pas un .xcodeproj commité : ce fichier se relit et se fusionne, là où
# un `project.pbxproj` produit des conflits illisibles dès que deux personnes
# touchent aux cibles. Le .xcodeproj est un artefact, il n'est pas versionné.
name: Vitrine
options:
  bundleIdPrefix: science.ellipse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 volontairement : le mode Swift 6 transforme les avertissements de
    # concurrence stricte en erreurs, et ce code n'a jamais été compilé (voir
    # la section « Non vérifié » du README).
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # À remplir avec l'identifiant d'équipe du compte développeur Apple.
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1" # iPhone. L'iPad l'exécute en mode compatibilité.
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vitrine:
    type: application
    platform: iOS
    sources:
      - path: Vitrine
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: science.ellipse.vitrine
        PRODUCT_NAME: Vitrine
        INFOPLIST_FILE: Vitrine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VitrineWidgetExtension
        embed: true

  # Cible SÉPARÉE, et c'est délibéré : la tuile est retirable sans toucher à
  # l'application. Supprimer ce bloc et la dépendance ci-dessus suffit.
  VitrineWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: VitrineWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: science.ellipse.vitrine.widget
        PRODUCT_NAME: VitrineWidgetExtension
        INFOPLIST_FILE: VitrineWidget/Info.plist
