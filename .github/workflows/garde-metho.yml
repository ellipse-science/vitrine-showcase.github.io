# Garde-fou : la page Méthodologie et les docs vivantes du pipeline
# (public/docs/*.html) ne doivent jamais être périmées.
# Si la PR touche des fichiers qui peuvent changer ce que la métho décrit
# (calculs, seuils, tables, graphiques), son corps doit contenir la section
# « Impact méthodologie » du template avec UNE case cochée.
# Le check se relance quand le corps de la PR est édité (type `edited`).
name: garde-metho

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  impact-methodologie:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la déclaration d'impact méthodologie
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
            echo "::error::Impossible de lister les fichiers de la PR (gh api a échoué) — check en échec par prudence plutôt que de laisser passer."
            exit 1
          fi
          echo "Fichiers modifiés :"
          echo "$files"
          # components/interactive/ était absent du filtre jusqu'au 2026-08-02 :
          # c'est pourtant là que vivent les clients de graphiques (p. ex.
          # PartisCouvertureClient.tsx, seul consommateur des tables
          # *_parties_salient_shadow_*). Une PR qui n'y touchait qu'à une
          # représentation échappait au garde.
          if ! echo "$files" | grep -qE '^(lib/|scripts/|components/sections/|components/interactive/|public/methodologie/|public/docs/)'; then
            echo "Aucun fichier sensible métho — rien à déclarer."
            exit 0
          fi
          checked=$(printf '%s' "$PR_BODY" | grep -cE -- '- \[[xX]\] (Aucun impact métho|Métho mise à jour|PR métho séparée)' || true)
          if printf '%s' "$PR_BODY" | grep -q "Impact méthodologie" && [ "$checked" -eq 1 ]; then
            echo "Déclaration d'impact métho présente (1 case cochée) — OK."
            exit 0
          fi
          if [ "$checked" -gt 1 ]; then
            echo "::error::Section « Impact méthodologie » : $checked cases cochées — les 3 options sont mutuellement exclusives, n'en cochez qu'UNE."
            exit 1
          fi
          echo "::error::Cette PR touche des fichiers qui peuvent affecter les TROIS docs vivantes — public/methodologie/index.html, public/docs/horaire-refiners-2026.html et public/docs/workflow-vitrine-2025-swimlanes.html (chemins surveillés : lib/, scripts/, components/sections/, components/interactive/, public/methodologie/, public/docs/). Ajoutez la section « Impact méthodologie » du template au corps de la PR et cochez une des 3 cases (le check se relance à l'édition du corps). Si vous cochez « aucun impact », vérifiez les trois docs, pas seulement la page Méthodologie. Guide : .claude/skills/synchro-methodologie/SKILL.md"
          exit 1
