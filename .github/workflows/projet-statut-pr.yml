name: Projet — statut des PR

# Fait passer une PR dans la bonne colonne du projet « MVP Vitrine démocratique »
# dès son ouverture, au lieu de la laisser dormir dans Backlog.
#
# ── POURQUOI CE WORKFLOW EXISTE ───────────────────────────────────────────────
# Aucun des workflows intégrés du projet ne réagit à l'OUVERTURE d'une PR :
# « Item added to project » pose le statut d'entrée (Backlog) sans distinguer
# issue et PR, et « Pull request merged » n'agit qu'à la toute fin. Entre les
# deux, une PR en attente de review restait invisible dans Backlog — la colonne
# « In review » affichait 0 alors que 5 PR attendaient vraiment (constat du
# 2026-07-15). D'où cette Action, qui ne couvre QUE ce trou.
#
# ── LE TOKEN ──────────────────────────────────────────────────────────────────
# Le GITHUB_TOKEN par défaut est limité au repo et NE PEUT PAS écrire dans un
# projet d'organisation (doc GitHub : « GITHUB_TOKEN is scoped to the repository
# level and cannot access projects »). Il faut donc un secret PROJECT_TOKEN =
# PAT (scopes `project` + `repo`) ou un token de GitHub App autorisé en
# lecture/écriture sur les projets de l'ORG (la permission « repository
# projects » ne suffit pas).
#
# Sans le secret, le job se contente d'un message et sort en succès : on ne
# bloque JAMAIS une PR pour une question de tableau de bord. C'est aussi ce qui
# rend les PR Dependabot et les forks inoffensifs — GitHub ne leur passe pas les
# secrets.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]

# Aucun droit sur le repo : tout passe par PROJECT_TOKEN.
permissions: {}

# Une PR ouverte puis passée en draft rapidement ne doit pas produire deux
# écritures concurrentes qui se marchent dessus — la dernière gagne.
concurrency:
  group: projet-statut-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  statut:
    runs-on: ubuntu-latest
    steps:
      - name: Placer la PR dans la bonne colonne
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            // ── Réglages ────────────────────────────────────────────────────
            const ORG = 'ellipse-science';
            const PROJET = 13;                 // MVP Vitrine démocratique
            const COLONNE_EN_REVIEW = 'In review';
            const COLONNE_DRAFT = 'In progress';

            if (!process.env.A_UN_TOKEN) {
              core.info('Secret PROJECT_TOKEN absent (PR de fork ou Dependabot ?) — rien à faire.');
              return;
            }

            const pr = context.payload.pull_request;
            // Une PR en draft n'attend pas de review : elle est « en cours ».
            const cible = pr.draft ? COLONNE_DRAFT : COLONNE_EN_REVIEW;

            // Tout ce qui suit parle à l'API : un token périmé, un champ
            // renommé ou une panne GraphQL doivent laisser la PR verte. Une
            // seule enveloppe try/catch — un échec devient un avertissement.
            try {
              // ── 1. Le projet, son champ Status et l'option visée ──────────
              const projet = await github.graphql(`
                query($org: String!, $num: Int!) {
                  organization(login: $org) {
                    projectV2(number: $num) {
                      id
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField { id options { id name } }
                      }
                    }
                  }
                }`, { org: ORG, num: PROJET });

              const p = projet.organization?.projectV2;
              const champ = p?.field;
              if (!champ) {
                core.warning(`Projet ${PROJET} ou son champ « Status » introuvable — statut inchangé.`);
                return;
              }
              const option = champ.options.find((o) => o.name === cible);
              if (!option) {
                // Quelqu'un a renommé la colonne dans l'UI : on le dit fort,
                // mais on ne fait pas échouer la PR pour autant.
                core.warning(`Colonne « ${cible} » introuvable dans le projet ${PROJET} — statut inchangé.`);
                return;
              }

              // ── 2. L'item de projet correspondant à cette PR ──────────────
              // Il existe déjà si « Auto-add to project » a fait son travail ;
              // sinon on l'ajoute nous-mêmes (course possible à l'ouverture).
              const vue = await github.graphql(`
                query($owner: String!, $repo: String!, $num: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $num) {
                      id
                      projectItems(first: 20) { nodes { id project { id } } }
                    }
                  }
                }`, { owner: context.repo.owner, repo: context.repo.repo, num: pr.number });

              const prNode = vue.repository.pullRequest;
              let item = prNode.projectItems.nodes.find((n) => n.project.id === p.id);

              if (!item) {
                const ajout = await github.graphql(`
                  mutation($projet: ID!, $contenu: ID!) {
                    addProjectV2ItemById(input: { projectId: $projet, contentId: $contenu }) {
                      item { id }
                    }
                  }`, { projet: p.id, contenu: prNode.id });
                item = ajout.addProjectV2ItemById.item;
                core.info('PR absente du projet — ajoutée.');
              }

              // ── 3. Poser le statut ───────────────────────────────────────
              await github.graphql(`
                mutation($projet: ID!, $item: ID!, $champ: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projet, itemId: $item, fieldId: $champ,
                    value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`, { projet: p.id, item: item.id, champ: champ.id, option: option.id });

              core.info(`PR #${pr.number} → « ${cible} ».`);
            } catch (erreur) {
              core.warning(`Statut de projet non posé (${erreur.message}) — la PR n'est pas bloquée pour autant.`);
            }
        env:
          # `secrets` n'est pas lisible depuis le script : on expose seulement
          # la PRÉSENCE du secret, jamais sa valeur.
          A_UN_TOKEN: ${{ secrets.PROJECT_TOKEN != '' || '' }}
