name: Traitement des signalements utilisateurs

on:
  repository_dispatch:
    types: [report-issue]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Formater et créer l'issue GitHub
        uses: actions/github-script@v9
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const description  = String(context.payload.client_payload?.description ?? '').slice(0, 2000).trim()
            const sectionRaw   = String(context.payload.client_payload?.section ?? 'Non précisée').slice(0, 100).trim()
            const elemCtx      = String(context.payload.client_payload?.elementContext ?? '').slice(0, 300).trim()
            const reporterName = String(context.payload.client_payload?.reporterName ?? '').slice(0, 100).trim()
            const screenshot   = context.payload.client_payload?.screenshot ?? null

            // ─────────────────────────────────────────────────────────────
            //  TRIAGE DES SIGNALEMENTS PAR ZONE
            //
            //  Chaque zone de la Vitrine (6 modules + habillage général) porte
            //  un `data-section` dans le DOM. Le client envoie cette valeur ;
            //  on la fait correspondre ici à un label GitHub.
            //
            //  POUR AJOUTER / RENOMMER UNE ZONE : éditer UNIQUEMENT le tableau
            //  SECTION_LABELS ci-dessous. Rien d'autre à toucher.
            //    - `match`   : fragments (sans accents, minuscules) reconnus
            //    - `section` : libellé propre affiché dans l'issue
            //    - `label`   : le label GitHub (créé automatiquement au besoin)
            // ─────────────────────────────────────────────────────────────
            const SECTION_LABELS = [
              // ── Les 6 modules ──────────────────────────────────────────
              { match: ['une des unes', 'unes des unes', 'module 1'],                    section: 'Une des unes',           label: { name: 'module-1-unes-des-unes',      color: '8b949e', description: 'Signalements du module Une des unes' } },
              { match: ['deux solitudes', '2 solitudes', 'module 2'],                    section: 'Deux solitudes',         label: { name: 'module-2-solitudes',          color: '1f6feb', description: 'Signalements du module Deux solitudes' } },
              { match: ['partis et couverture', 'couverture des partis', 'module 3'],    section: 'Partis et couverture',   label: { name: 'module-3-partis-couverture',  color: '0969da', description: 'Signalements du module Partis et couverture' } },
              { match: ['enjeux saillants', 'de quoi parle', 'module 4'],                section: 'Enjeux saillants',       label: { name: 'module-4-enjeux-saillants',   color: '1a7f37', description: 'Signalements du module Enjeux saillants' } },
              { match: ['assemblee nationale', "que dit-on a l'assemblee", 'module 5'],  section: 'Assemblée nationale',    label: { name: 'module-5-assemblee-nationale', color: 'bf8700', description: 'Signalements du module Assemblée nationale' } },
              { match: ['polimetre', 'module 6'],                                        section: 'Polimètre+',             label: { name: 'module-6-polimetre',          color: '8250df', description: 'Signalements du module Polimètre+' } },
              // ── Habillage général du site (hors modules) ───────────────
              { match: ['en-tete', 'en tete', 'header'],                                 section: 'En-tête',                label: { name: 'site-header',                 color: 'c8cdd4', description: 'Signalements sur l’en-tête du site' } },
              { match: ['pied de page', 'footer'],                                       section: 'Pied de page',           label: { name: 'site-footer',                 color: 'c8cdd4', description: 'Signalements sur le pied de page du site' } },
              { match: ['methodolog'],                                                   section: 'Méthodologie',           label: { name: 'page-methodologie',           color: 'a8a29e', description: 'Signalements sur la page Méthodologie' } },
              { match: ['a propos', 'apropos'],                                          section: 'À propos',               label: { name: 'page-apropos',                color: 'a8a29e', description: 'Signalements sur la page À propos' } },
              { match: ['abonnement'],                                                   section: 'Abonnement',             label: { name: 'page-abonnement',             color: 'a8a29e', description: 'Signalements sur la page Abonnement' } },
              { match: ['journal'],                                                      section: 'Journal',                label: { name: 'page-journal',                color: 'a8a29e', description: 'Signalements sur la page Journal des mises à jour' } },
            ]

            function normalizeSectionName(value) {
              return String(value ?? '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim()
            }

            function mapSection(raw) {
              const n = normalizeSectionName(raw)
              const hit = SECTION_LABELS.find(entry => entry.match.some(m => n.includes(m)))
              if (hit) return { section: hit.section, moduleLabel: hit.label }
              return { section: raw || 'Non précisée', moduleLabel: null }
            }

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner: 'ellipse-science',
                  repo: 'vitrine-showcase.github.io',
                  name: label.name,
                })
                return
              } catch (err) {
                if (err?.status !== 404) throw err
              }
              try {
                await github.rest.issues.createLabel({
                  owner: 'ellipse-science',
                  repo: 'vitrine-showcase.github.io',
                  name: label.name,
                  color: label.color,
                  description: label.description,
                })
              } catch (err) {
                // 422 = le label a été créé entre-temps (course entre deux
                // dispatchs simultanés) → considéré comme un succès (idempotent).
                if (err?.status !== 422) throw err
              }
            }

            const mapped  = mapSection(sectionRaw)
            const section = mapped.section

            if (!description) {
              core.setFailed('Description vide — signalement ignoré.')
              return
            }

            const PRIORITY_REPORTERS = ['yannick', 'shannon']
            const isPriority = PRIORITY_REPORTERS.some(n => reporterName.toLowerCase().startsWith(n))

            const systemPrompt = `Tu es un assistant qui reformate des signalements d'utilisateurs en issues GitHub structurées pour "La Vitrine démocratique", un tableau de bord québécois de veille médiatique produit par le CAPP (Université Laval).

            Reformate le signalement en Markdown avec exactement ces sections :
            ## Description
            ## Composant concerné
            ## Contexte visible
            ## Signalé par

            Ne rien inventer. Conserve l'information telle quelle. Réponds uniquement en français.`

            const userPrompt = `Section : ${section}\nContexte visible : ${elemCtx}\nSignalement : ${description}\nSignalé par : ${reporterName || 'Anonyme'}`

            let body = `## Description\n${description}\n\n## Composant concerné\n${section}\n\n## Contexte visible\n${elemCtx || '_Non disponible_'}\n\n## Signalé par\n${reporterName || '_Anonyme_'}`

            try {
              const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user',   content: userPrompt   },
                  ],
                  max_tokens: 600,
                }),
              })
              if (res.ok) {
                const data = await res.json()
                body = data.choices?.[0]?.message?.content ?? body
              } else {
                core.warning(`OpenAI a retourné ${res.status} — issue créée sans reformatage.`)
              }
            } catch (err) {
              core.warning(`OpenAI indisponible — issue créée sans reformatage : ${err}`)
            }

            // Committer la capture d'écran dans le repo et insérer l'URL raw dans l'issue
            if (screenshot?.base64 && screenshot?.name) {
              try {
                const b64 = String(screenshot.base64).slice(0, 60_000)
                const buffer = Buffer.from(b64, 'base64')

                // Taille max ~45 Ko décodés (budget client-side)
                if (buffer.length > 50_000) {
                  core.warning(`Capture ignorée — trop volumineuse (${buffer.length} octets).`)
                // Magic bytes JPEG : FF D8 FF
                } else if (buffer[0] !== 0xFF || buffer[1] !== 0xD8 || buffer[2] !== 0xFF) {
                  core.warning(`Capture ignorée — le payload n'est pas un JPEG valide.`)
                } else {
                  const filename = `screenshot-${Date.now()}.jpg`

                  await github.rest.repos.createOrUpdateFileContents({
                    owner:   'ellipse-science',
                    repo:    'vitrine-showcase.github.io',
                    path:    filename,
                    message: `chore: add screenshot`,
                    content: b64,
                    branch:  'screenshots',
                  })

                  const imageUrl = `https://raw.githubusercontent.com/ellipse-science/vitrine-showcase.github.io/screenshots/${filename}`
                  body += `\n\n## Capture d'écran\n\n![Capture d'écran](${imageUrl})`
                }
              } catch (err) {
                core.warning(`Impossible de committer la capture d'écran : ${err}`)
              }
            }

            const shortDesc = description.length > 55 ? description.slice(0, 55) + '…' : description
            const prefix    = section !== 'Non précisée' ? `${section} — ` : ''
            const title     = `[Signalement] ${prefix}${shortDesc}`
            const labels    = ['signalement-utilisateur', ...(isPriority ? ['prioritaire'] : [])]

            if (mapped.moduleLabel) {
              try {
                await ensureLabel(mapped.moduleLabel)
                labels.push(mapped.moduleLabel.name)
              } catch (err) {
                core.warning(`Impossible d'ajouter le label de zone : ${err}`)
              }
            }

            await github.rest.issues.create({
              owner:  'ellipse-science',
              repo:   'vitrine-showcase.github.io',
              title,
              body,
              labels,
            })
