name: Déploiement dev (Cloudflare Pages)

# Publie le miroir dev sur dev.vitrinedemocratique.com, protégé par Cloudflare
# Access.
#
# DEPUIS LE 2026-08-30, ce workflow est le SEUL chemin de déploiement de dev
# côté GitHub Actions : `deploy.yml` et le miroir GitHub Pages ont été
# débranchés. Trois raisons, dans l'ordre où elles ont mordu :
#   - le miroir n'était pas un double fidèle (autre build, et il lisait les
#     JSON commités quand dev lit l'API) ;
#   - il induisait en erreur : le 30-08, un correctif a été déclaré « en dev »
#     cinq fois sur sa foi, alors que Cloudflare avait cessé de bâtir ;
#   - il perçait Cloudflare Access, en servant publiquement le même contenu.
#
# BASCULE 2026-08-19 : le build dev est déclenché par Cloudflare (intégration
# Git de Pages au push, Deploy Hook du Worker au cycle de données). Ce
# workflow ne se déclenche plus qu'à la main, en secours : le laisser au push
# déploierait DEUX FOIS chaque poussée.
# REPRISE DU DÉCLENCHEMENT AU PUSH, 2026-08-30. L'intégration Git de Cloudflare
# a cessé de bâtir après le commit 94326406 (20h14) : aucun check sur les
# commits suivants, et dev servait un build vieux de plusieurs heures pendant
# qu'on croyait le contraire. Le même soir, le miroir GitHub Pages — l'autre
# chemin — a été débranché. Dev se retrouvait donc sans AUCUN déploiement
# automatique, ce qui n'est pas tenable pendant une campagne.
#
# ⚠️ CONSÉQUENCE ASSUMÉE : si l'intégration Git de Cloudflare se remet à
# fonctionner, chaque poussée déploiera DEUX FOIS. C'est du gaspillage, pas une
# panne — les deux chemins publient le même `out/`. Quand l'intégration sera
# confirmée saine (un check `Cloudflare Pages` vert sur plusieurs commits
# d'affilée), retirer le `push:` ci-dessous et revenir au dispatch seul.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev-cloudflare
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Wait for git replication
        run: sleep 15

      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export + postbuild asset copy)
        run: npm run build
        env:
          # PAS DE `VITRINE_PARTIES_FIXTURES` ici depuis le 2026-09-01 : la
          # forcer datait du moment où le modèle des partis était dégénéré
          # (aws-refiners#223/#248, un seul parti détecté), et servait aussi à
          # garder le miroir dev identique au miroir GitHub Pages — débranché
          # depuis. Le modèle a été réentraîné (§06 de la méthodologie), donc
          # dev lit maintenant l'API comme le reste du build, sans fausses
          # données forcées dessus. Le module reste `isProd → null` : rien de
          # tout ça n'atteint la production tant qu'il est retiré.
          # Servi à la RACINE de son propre domaine, contrairement au miroir
          # GitHub Pages qui vit sous un sous-chemin.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_ENV: dev
          NEXT_PUBLIC_SITE_ORIGIN: https://dev.vitrinedemocratique.com
          # Les données viennent désormais de l'API, pas des JSON commités.
          # Le site reste un export statique : la lecture a lieu AU BUILD et le
          # résultat est inliné dans le HTML. Aucun navigateur n'appelle l'API.
          #
          # refresh-data.yml continue de tourner et de commiter les JSON : c'est
          # eux que la synchro charge dans Postgres, et ils servent de repli si
          # l'API ne répond pas. Rien n'est débranché.
          VITRINE_DATA_SOURCE: api
          # Les jeux sont payants : même le site s'authentifie. Cette clé porte
          # la portée totale et aucun quota — ce n'est pas un client.
          VITRINE_API_KEY: ${{ secrets.VITRINE_API_KEY }}
          NEXT_PUBLIC_DISPATCH_URL: ${{ secrets.DISPATCH_WORKER_URL }}
          NEXT_PUBLIC_UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          NEXT_PUBLIC_UPSTASH_REDIS_REST_READONLY_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_READONLY_TOKEN }}

      - name: Publier sur Cloudflare Pages (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy out \
            --project-name vitrine-democratique-dev \
            --branch develop \
            --commit-hash "$GITHUB_SHA"
