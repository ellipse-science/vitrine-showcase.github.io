name: Auto-assign issues by module

# Assigne automatiquement chaque issue à son ou ses propriétaires selon le label
# de module, dès qu'elle est ouverte ou labellisée (le label est posé par le
# reporter du site via report-issue.yml, ou à la main sur GitHub).
#
# ── DEUX PORTES D'ENTRÉE ──────────────────────────────────────────────────────
# 1. `issues` (opened/labeled) : issues créées par un HUMAIN sur GitHub.
# 2. `workflow_call`           : appelé explicitement par report-issue.yml.
#    Nécessaire parce qu'une issue créée par un workflow avec le GITHUB_TOKEN
#    ne déclenche AUCUN autre workflow (garde-fou anti-boucle de GitHub) — les
#    signalements du site n'étaient donc jamais assignés.
#
# ── OWNERSHIP VIVANT ──────────────────────────────────────────────────────────
# L'ownership change avec l'équipe. La SEULE chose à éditer = la table OWNERS
# (et les pools habillage) dans le script ci-dessous. Garder synchro avec
# AGENTS.md § Module naming et la mémoire de triage.

on:
  issues:
    types: [opened, labeled]
  workflow_call:
    inputs:
      issue_number:
        description: Numéro de l'issue à assigner
        required: true
        type: number

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign owner(s) from module label
        uses: actions/github-script@v9
        env:
          # `inputs` est vide sur un déclenchement `issues` → on retombe sur le payload.
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        with:
          script: |
            // ── Table déclarative (label → propriétaires GitHub) ──────────────
            const OWNERS = {
              'module-1-unes-des-unes':      ['AdriClout'],
              'module-2-solitudes':          ['AdriClout'],
              'module-3-partis-couverture':  ['etienneprx', 'julespiral'],
              'module-4-enjeux-saillants':   ['laurenceomfoisy'],
              'module-5-assemblee-nationale':['etienneprx'],
              'module-6-polimetre':          ['SkelAlex'],
            };
            // Habillage = un peu tout le monde → tirage stable dans ce pool.
            const HABILLAGE_LABELS = ['site-header', 'site-footer', 'page-methodologie', 'page-apropos', 'page-abonnement', 'page-journal'];
            const HABILLAGE_POOL = ['AdriClout', 'capel201', 'etienneprx', 'julespiral'];

            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.info('Aucun numéro d’issue exploitable — rien à faire.');
              return;
            }

            // On relit l'issue via l'API plutôt que le payload : c'est la seule
            // source fiable quand on est appelé par un autre workflow, et ça
            // reflète les labels/assignations posés depuis l'événement.
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Ne jamais écraser une assignation manuelle (le triage humain gagne).
            if (issue.assignees && issue.assignees.length > 0) {
              core.info('Issue déjà assignée — on ne touche pas.');
              return;
            }

            // Normalise + filtre les labels vides (un label objet sans `name`).
            const labels = (issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l && l.name))
              .filter(Boolean);

            let assignees = null;
            for (const [label, owners] of Object.entries(OWNERS)) {
              if (labels.includes(label)) { assignees = owners; break; }
            }
            if (!assignees) {
              if (labels.some(l => HABILLAGE_LABELS.includes(l))) {
                // Tirage reproductible basé sur le numéro d'issue.
                assignees = [HABILLAGE_POOL[issueNumber % HABILLAGE_POOL.length]];
              }
            }
            if (!assignees || assignees.length === 0) {
              core.info('Aucun label module/habillage reconnu — pas d’assignation auto.');
              return;
            }

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                assignees,
              });
              core.info('Assigné à : ' + assignees.join(', '));
            } catch (e) {
              // Un handle sans accès au repo est ignoré par l'API — on log, on ne bloque pas.
              core.warning('Échec assignation (' + assignees.join(', ') + ') : ' + e.message);
            }
