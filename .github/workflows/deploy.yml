name: Déploiement dev (Cloudflare Pages)

# Le miroir dev vit désormais sur dev.vitrinedemocratique.com (Cloudflare Pages,
# projet `vitrine-democratique-dev`), et non plus sur GitHub Pages.
#
# POURQUOI LE DÉMÉNAGEMENT : le dev doit être protégé par mot de passe. GitHub
# Pages ne sait pas authentifier un dépôt public — la seule protection possible
# était l'obscurité. Cloudflare Access le fait proprement. Tant qu'une copie
# publique restait servie par GitHub Pages, protéger dev.vitrinedemocratique.com
# n'aurait été qu'un décor : le même contenu restait lisible ailleurs.
#
# La construction se fait ICI (GitHub Actions), pas chez Cloudflare : le dépôt
# pèse 1,3 Go et la sortie ~500 Mo, ce qui est beaucoup à cloner et construire
# sous le plafond de 20 minutes de Cloudflare. Actions le fait déjà six fois par
# jour sans problème ; on n'envoie que le résultat.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Brief pause so GitHub's HTTPS git backend has time to replicate a
      # freshly pushed commit before checkout tries to fetch it by SHA.
      - name: Wait for git replication
        run: sleep 15

      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fausses données du module des partis, pour le MIROIR DEV seulement.
      #
      # La mesure provinciale est suspendue (aws-refiners#248) : sans fixtures,
      # le module n'affiche que son avis de suspension, et l'équipe ne peut ni
      # l'essayer ni ouvrir d'issues dessus. Les fixtures ne sont pas versionnées
      # (`.gitignore`), on les génère donc ici, à chaque déploiement.
      #
      # Sûr parce que ce workflow pose NEXT_PUBLIC_SITE_ENV=dev, le seul signal
      # qui autorise les fixtures : `lib/data/parties.ts` fait ÉCHOUER tout build
      # de CI qui combinerait fixtures et un autre environnement. Le workflow de
      # production ne pose pas la variable et ne peut donc pas en hériter. Le
      # module porte en plus un bandeau « Données fictives : ne pas diffuser ».
      - name: Générer les fausses données (miroir dev)
        run: node scripts/make_parties_fixtures.mjs

      - name: Build (Next.js static export + postbuild asset copy)
        run: npm run build
        env:
          VITRINE_PARTIES_FIXTURES: fixtures/parties
          # Le dev est servi à la RACINE de son propre domaine : basePath vide,
          # comme la prod. C'est pourquoi le basePath ne peut plus servir à
          # distinguer les deux — d'où NEXT_PUBLIC_SITE_ENV ci-dessous.
          NEXT_PUBLIC_BASE_PATH: ""
          # Pilote à la fois robots.txt (Disallow) et l'autorisation des
          # fixtures. Un seul signal, pour qu'ils ne divergent pas.
          NEXT_PUBLIC_SITE_ENV: dev
          NEXT_PUBLIC_SITE_ORIGIN: https://dev.vitrinedemocratique.com
          # URL publique du Worker Cloudflare — pas un secret, juste une URL
          NEXT_PUBLIC_DISPATCH_URL: ${{ secrets.DISPATCH_WORKER_URL }}
          # Classement Flappy, EN LECTURE SEULE. Ces deux valeurs finissent dans
          # le bundle client (préfixe NEXT_PUBLIC_) : c'est assumé pour un jeton
          # de lecture, jamais pour un jeton d'écriture — cf. lib/flappyLeaderboard.ts.
          # Absentes, le classement s'affiche vide, sans erreur.
          NEXT_PUBLIC_UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          NEXT_PUBLIC_UPSTASH_REDIS_REST_READONLY_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_READONLY_TOKEN }}

      - name: Publier sur Cloudflare Pages (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy out \
            --project-name vitrine-democratique-dev \
            --branch main \
            --commit-hash "$GITHUB_SHA"
