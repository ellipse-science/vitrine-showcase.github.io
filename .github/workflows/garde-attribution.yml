# Garde-fou : aucune IA en PATERNITÉ d'un commit (issue #235).
# On distingue paternité et provenance :
#   • PATERNITÉ (bloquée) — auteur/committer IA, ou trailer « Co-Authored-By »
#     pointant vers une IA. GitHub parse ces signaux comme de la co-signature et
#     crédite le co-auteur dans le graphe Contributors : noreply@anthropic.com est
#     rattaché au compte GitHub « claude », qui apparaissait comme 2e contributeur
#     du repo. Un livrable scientifique n'a pas d'auteur non humain.
#   • PROVENANCE (obligatoire dès qu'une IA a aidé, toujours en français) — trailer
#     « Assisté par : » / « Généré avec : » documentant l'outil qui a assisté le travail.
#     GitHub NE le parse PAS comme une co-signature : le graphe reste propre, l'humain
#     reste seul auteur, et l'assistance machine est tout de même tracée de façon
#     transparente (cf. AGENTS.md hard rule #8). La provenance s'écrit en français ; sur
#     les issues et les réponses/commentaires de PR, c'est une ligne « 🤖 Assisté par … »
#     (convention — non vérifiée ici, ce check n'inspecte que les commits).
# Ce check ne bloque QUE la paternité — les trailers de provenance passent.
# Il inspecte les commits de la PR ; il se relance à chaque push (type `synchronize`).
# Détection par adresse courriel (domaines IA connus), pas par prénom — un humain
# nommé Claude ne déclenche rien.
name: garde-attribution

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  attribution-humaine:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier qu'aucun commit n'est attribué à une IA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # NB : doubles backslashes pour que jq voie \. dans la regex ;
          # dans jq (Oniguruma), ^ n'ancre que le début de chaîne, d'où (^|\n).
          #
          # Deux patterns distincts (retour Copilot #236) :
          # - email_pattern : testé seul contre une adresse courriel complète
          #   (author/committer.email) -> ^claude@ ancre correctement le début
          #   de cette chaîne autonome.
          # - trailer_pattern : le motif IA doit matcher DANS le <...> du
          #   trailer Co-Authored-By, jamais dans le nom affiché avant '<' —
          #   sinon un nom contenant "copilot"/"chatgpt" déclencherait le
          #   garde-fou par le prénom, pas par l'adresse (contraire au doc).
          #   ^claude@ y est donc remplacé par claude@ (sans ancre, puisque
          #   le motif est déjà borné par [^>]*...[^>]* à l'intérieur des
          #   chevrons, qui jouent le rôle d'ancre).
          #
          # Le test de message cible spécifiquement le trailer « co-authored-by: »
          # (PATERNITÉ). Un trailer de PROVENANCE « assisté par : » / « généré avec : »
          # ne correspond donc pas et passe volontairement — c'est la forme sanctionnée
          # pour tracer l'assistance machine sans créer de co-auteur.
          email_pattern='anthropic\\.com|^claude@|copilot|openai\\.com|chatgpt'
          trailer_pattern='anthropic\\.com|claude@|copilot|openai\\.com|chatgpt'
          if ! bad=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '
                .[]
                | select(
                    ([.commit.author.email, .commit.committer.email] | any(test("'"$email_pattern"'"; "i")))
                    or (.commit.message | test("(^|\\n)\\s*co-authored-by:[^<\\n]*<[^>]*('"$trailer_pattern"')[^>]*>"; "i"))
                  )
                | .sha[0:8] + "  " + (.commit.message | split("\n")[0])'); then
            echo "::error::Impossible de lister les commits de la PR (gh api a échoué) — check en échec par prudence plutôt que de laisser passer."
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "Commits fautifs :"
            echo "$bad"
            echo "::error::Des commits de cette PR mettent une IA en PATERNITÉ (auteur/committer, ou trailer Co-Authored-By). Réécrivez-les (git rebase -i puis reword/--reset-author) pour les attribuer à la personne humaine. Pour ne plus générer le trailer : includeCoAuthoredBy=false est déjà dans .claude/settings.json — assurez-vous que votre outil le respecte. NB : documenter l'assistance machine reste permis et encouragé via un trailer de PROVENANCE 'Assisté par : Claude Code (Opus 4.8)' — en français (non compté comme co-auteur). Règle : AGENTS.md, hard rule #8 (issue #235)."
            exit 1
          fi
          echo "Tous les commits de la PR sont attribués à des humains — OK."
