name: Refresh Data

# Triggered exclusively by cron-job.org via the GitHub REST API.
# No schedule: trigger — GitHub Actions native cron is unreliable for
# election-scale data freshness. Use cron-job.org → workflow_dispatch instead.
#
# cron-job.org setup (post-merge, one-time):
#   URL:    https://api.github.com/repos/<owner>/vitrine-showcase.github.io/actions/workflows/refresh-data.yml/dispatches
#   Method: POST   Body: {"ref":"main"}
#   Header: Authorization: token <GitHub PAT with workflow scope>
#   Cron:   50 0,4,8,12,16,20 * * *  (UTC — 5 min after each pipeline publish)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AWS_ACCESS_KEY_ID_PROD:     ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
      AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
      AWS_ACCESS_KEY_ID_DEV:      ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
      AWS_SECRET_ACCESS_KEY_DEV:  ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
      AWS_REGION:                 ${{ secrets.AWS_REGION }}
      HEALTHCHECKS_URL:      ${{ secrets.HEALTHCHECKS_URL }}
      # ─── DEUX DESTINATIONS, SELON LA GRAVITÉ (décision Adrien 2026-08-08) ───
      # L'architecture de surveillance est UNE CHAÎNE PAR CORPUS : les médias ont
      # #02_radar-plus_sonar, les décideurs #02__agora-plus_sonar, et la vitrine
      # (ce dépôt) a la sienne. Ce qui vient d'ici ne va donc PAS dans la chaîne
      # de Radar+ — corrige le cadrage de la PR #417, qui datait du matin même.
      #
      # SLACK_VITRINE_SONAR_WEBHOOK_URL -> #02_vitrine_sonar : ce qui rend le site
      #   FAUX ou VIEUX (rafraîchissement échoué, Une périmée). C'est ce qu'on lit.
      # SLACK_WEBHOOK_URL -> #02_hydration_watchdog : les échecs COSMÉTIQUES
      #   (image, musique), fréquents et sans conséquence sur l'exactitude. On
      #   laisse ce bruit où il est plutôt que de le déverser dans une chaîne
      #   qu'on veut pouvoir lire — consigne explicite d'Adrien.
      #
      # Tant que le secret du sonar vitrine n'existe pas, les alertes graves
      # RETOMBENT sur SLACK_WEBHOOK_URL : on préfère une alerte au mauvais endroit
      # à une alerte perdue. Le courriel Healthchecks reste le secours hors Slack.
      SLACK_VITRINE_SONAR_WEBHOOK_URL: ${{ secrets.SLACK_VITRINE_SONAR_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL:     ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_MUSIC_WEBHOOK_URL:    ${{ secrets.SLACK_MUSIC_WEBHOOK_URL }}
      OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
      REPLICATE_API_TOKEN:   ${{ secrets.REPLICATE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # persist-credentials must stay true (default) so checkout's SSH
          # config survives into the "Commit updated data files" push step.
          ssh-key: ${{ secrets.REFRESH_DATA_DEPLOY_KEY }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-v1
          restore-keys: r-${{ runner.os }}-

      - name: Install R packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
            pkgs <- c("remotes", "dplyr", "jsonlite", "lubridate")
            install.packages(pkgs[!pkgs %in% installed.packages()[,"Package"]])
            # install_github touche un endpoint api.github.com soumis a la limite
            # SECONDAIRE de GitHub : HTTP 429 meme avec quota plein (5000/5000),
            # surtout depuis les IP partagees des runners Actions. Cest intermittent
            # -> retry avec backoff jusqua tomber sur une fenetre non throttlee.
            # Pas depinglage de SHA : on veut le tube a jour (fix paws/dbplyr de Patrick).
            for (i in 1:6) {
              ok <- tryCatch({
                remotes::install_github("ellipse-science/tube", upgrade = "never", quiet = TRUE)
                TRUE
              }, error = function(e) {
                message(sprintf("tube install attempt %d/6 failed: %s", i, conditionMessage(e)))
                FALSE
              })
              if (ok) break
              if (i == 6) stop("Failed to install tube after 6 attempts (GitHub secondary rate limit 429?)")
              Sys.sleep(2^i * 5)  # backoff: 10, 20, 40, 80, 160s
            }
          '

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # Pillow ≥ 11.3 encode l'AVIF nativement (vérifié en 12.3) : pas de
        # pillow-avif-plugin ici, on n'ajoute pas un paquet dont l'échec
        # d'installation ferait tomber toute l'étape. generate_art.py tente
        # quand même l'import du plugin, au cas où l'environnement serait plus
        # ancien, et se rabat sur le WebP seul si l'AVIF n'est pas disponible.
        run: pip install openai pillow python-dotenv replicate

      - name: Fetch data from Athena
        run: Rscript scripts/fetch_data.R

      # Alarme de fraîcheur (réf. aws-refiners#278) : un retard CONSTANT
      # d'environ 4h SANS aucune erreur = un stepper de la cascade AWS coincé
      # un bloc en arrière — panne silencieuse restée invisible ~30h les
      # 6-7 août 2026. On mesure l'âge du bloc le plus frais réellement servi
      # (normal ≈ 1h au fetch, ≈ 5h dès qu'un bloc manque) ; l'alerte Slack
      # ci-dessous sonne au-delà du seuil, à chaque fetch tant que ça dure.
      # Non bloquant : une donnée en retard doit quand même être publiée.
      - name: Check headline freshness (silent-lag alarm)
        id: freshness
        continue-on-error: true
        run: python scripts/check_freshness.py

      # Best-effort : un Slack indisponible ne doit pas empêcher le commit des
      # données plus bas — la donnée (même en retard) se publie toujours.
      - name: Alert Slack if headline data is stale
        if: steps.freshness.outputs.stale == 'true'
        continue-on-error: true
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PAYLOAD="{\"text\":\"🔴 *Vitrine : la Une est périmée* — ${{ steps.freshness.outputs.resume }}. Diagnostic : skill diagnostic-donnees-perimees ; remède : skill rattrapage-radar-data-prep.\nRun: ${RUN_URL}\"}"
          # Sonar vitrine si le secret existe, sinon repli sur l'ancien webhook :
          # une alerte au mauvais endroit vaut mieux qu'une alerte perdue.
          HOOK="${SLACK_VITRINE_SONAR_WEBHOOK_URL:-$SLACK_WEBHOOK_URL}"
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$HOOK"
          fi

      # Courriel clair via Healthchecks.io (secret HEALTHCHECKS_URL existant,
      # jusqu'ici déclaré mais jamais pingé) : battement de cœur à chaque
      # fetch, ping /fail quand la Une est périmée → courriel « DOWN » avec
      # l'âge en corps, puis « UP » au rétablissement. Si le workflow meurt
      # entièrement, le battement manque et Healthchecks alerte aussi —
      # couvre le fetch mort ET le retard silencieux.
      - name: Signal freshness to Healthchecks (email alert)
        if: steps.freshness.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -n "$HEALTHCHECKS_URL" ]; then
            if [ "${{ steps.freshness.outputs.stale }}" = "true" ]; then
              curl -fsS -m 10 --retry 3 --data-raw "La Une est périmée : ${{ steps.freshness.outputs.resume }}. Diagnostic : skill diagnostic-donnees-perimees ; remède : skill rattrapage-radar-data-prep." "$HEALTHCHECKS_URL/fail"
            else
              curl -fsS -m 10 --retry 3 --data-raw "${{ steps.freshness.outputs.resume }}" "$HEALTHCHECKS_URL"
            fi
          fi

      # Node n'était pas installé dans ce job : il l'est maintenant pour une
      # seule raison — faire désigner la Une n°1 par le MÊME code que le site,
      # au lieu de la laisser deviner par le script d'illustration (issue #259).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Écrit public/data/hero-selection.json — l'illustration s'y réfère.
      # Non bloquant : si ça échoue, generate_art.py reprend son heuristique.
      #
      # On EFFACE le fichier d'abord. Il est commité à chaque rafraîchissement,
      # donc en cas d'échec une version PÉRIMÉE traînerait sur le disque et
      # generate_art.py illustrerait une Une passée en croyant suivre le site —
      # précisément le bug que cette étape corrige. Absent, le repli heuristique
      # joue ; périmé, il ne joue pas. Mieux vaut pas de fichier qu'un vieux.
      - name: Designate the hero headline
        continue-on-error: true
        run: |
          rm -f public/data/hero-selection.json
          npm run select-hero

      - name: Generate AI art (best-effort, non-blocking)
        id: art
        continue-on-error: true
        run: python scripts/generate_art.py

      - name: Generate ambient music (best-effort, non-blocking)
        id: music
        continue-on-error: true
        run: python scripts/generate_music.py

      - name: Commit updated data files
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ public/audio/
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # Use SSH so pushes are authenticated with the dedicated deploy key.
            git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
            # Rebase first: defensive against any concurrent push to main.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Recharge Postgres AVANT de pousser sur `prod`.
      #
      # C'EST UNE QUESTION D'ORDRE, ET ELLE A DÉJÀ COÛTÉ UNE RÉGRESSION. La
      # poussée sur `prod` déclenche le déploiement dans la minute, et ce
      # déploiement lit l'API. Si la synchro n'avait lieu que sur son propre
      # horaire (le cron du Worker), le build lirait l'API à un moment où elle
      # contient encore le cycle précédent : c'est ce qui s'est produit le
      # 2026-08-18, le site affichant des données de plusieurs heures plus
      # anciennes que celles qui venaient d'être publiées.
      #
      # Séquence garantie : JSON commités sur main → Postgres rechargé →
      # poussée sur prod → build. Le cron du Worker reste comme filet.
      #
      # PAR TRANCHES DE QUATRE TABLES : sur le plan gratuit de Workers, un
      # gestionnaire `fetch` dispose de 10 ms de CPU (le cron en a 30 s). Un
      # appel unique meurt vers la sixième table ; quatre appels passent. La
      # boucle suit `next` jusqu'à ce qu'il soit nul.
      #
      # `continue-on-error` : une synchro ratée ne doit pas empêcher les données
      # d'atteindre `prod`. Le build a sa propre garde de fraîcheur et repartira
      # des fichiers commités plutôt que de publier du périmé.
      - name: Recharger Postgres (API) avant la poussée prod
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          VITRINE_API_KEY: ${{ secrets.VITRINE_API_KEY }}
        run: |
          set -uo pipefail
          offset=0
          for _ in $(seq 1 8); do
            body=$(curl -sS --max-time 180 -X POST \
                     -H "Authorization: Bearer $VITRINE_API_KEY" \
                     "https://api.vitrinedemocratique.com/v1/sync?offset=$offset&limit=4") || {
              echo "::warning::Appel de synchro échoué. Le build repartira des fichiers."
              exit 0
            }
            echo "$body"
            next=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('next') or '')" 2>/dev/null || echo "")
            [ -z "$next" ] && break
            offset=$next
          done
          echo "Synchro Postgres terminée."

      - name: Sync fresh data to prod branch
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Dev/prod split: code is gated behind manual main→prod merges, but the
          # public prod site must stay fresh every 4h. This copies ONLY the data
          # payload (public/data + public/audio) from the just-pushed main onto
          # prod — never code. Replacing (not merging) the paths means no conflicts.
          # No-op until the prod branch exists (created during Cloudflare setup),
          # so this is safe to merge to main before prod is stood up.
          if ! git ls-remote --exit-code --heads origin prod >/dev/null 2>&1; then
            echo "No prod branch yet — skipping prod data sync."
            exit 0
          fi
          git fetch origin prod
          # Use FETCH_HEAD, not origin/prod: actions/checkout configures a narrow
          # fetch refspec scoped to main, so the remote-tracking ref refs/remotes/
          # origin/prod may not exist. FETCH_HEAD always points at the just-fetched tip.
          git checkout -B prod FETCH_HEAD
          git checkout main -- public/data/ public/audio/
          git add public/data/ public/audio/
          if git diff --cached --quiet; then
            echo "prod data already current — nothing to sync."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [prod data sync]"
            git push origin prod
          fi

      # Le rafraîchissement a échoué = le site ne s'est pas mis à jour. C'est une
      # alerte de sonar vitrine, pas du bruit cosmétique.
      - name: Alert Slack on failure
        if: failure()
        run: |
          HOOK="${SLACK_VITRINE_SONAR_WEBHOOK_URL:-$SLACK_WEBHOOK_URL}"
          if [ -n "$HOOK" ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ *Vitrine data refresh FAILED*\nRun: ${RUN_URL}\"}" \
              "$HOOK"
          fi

      # Art et musique : cosmétique et fréquent. Reste dans le watchdog — on ne
      # déverse pas ce bruit dans une chaîne qu'on veut pouvoir lire.
      - name: Warn Slack if art generation failed (data still published)
        if: steps.art.outcome == 'failure'
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"🟡 *Vitrine art generation failed* — data was refreshed and deployed normally; only the AI image is stale.\nRun: ${RUN_URL}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi

      - name: Warn Slack if music generation failed (data still published)
        if: steps.music.outcome == 'failure'
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"🟡 *Vitrine music generation failed* — data was refreshed normally; only the ambient music is stale.\nRun: ${RUN_URL}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
