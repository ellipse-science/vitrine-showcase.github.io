name: CI

on:
  pull_request:
    # `prod` autant que `main` : le ruleset de `prod` EXIGE le contrôle
    # « check », et sans cette ligne il ne s'exécute jamais sur une PR de
    # promotion — celle-ci reste alors bloquée pour toujours, en attendant un
    # contrôle qui ne viendra pas. Une promotion mérite de toute façon d'être
    # testée : c'est elle qui met le code en production.
    branches: [main, prod]

permissions:
  contents: read

# Cancel in-progress runs for the same PR when a new commit lands
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
